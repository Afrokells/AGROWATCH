name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web App & Sync Capacitor Android
        working-directory: frontend
        run: |
          npm run build
          npx cap sync android

      - name: Remove any local properties
        run: |
          rm -f local.properties frontend/android/local.properties

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgroWatch-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web App & Sync Capacitor iOS
        working-directory: frontend
        run: |
          npm run build
          npx cap sync ios

      - name: Build iOS Application (Simulator & Universal Bundle)
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package iOS IPA & Zip Bundle
        run: |
          mkdir -p build/Payload
          APP_BUNDLE=$(find frontend/ios/App/build_output -name "App.app" -type d | head -n 1)
          echo "Found bundle at: $APP_BUNDLE"
          cp -R "$APP_BUNDLE" build/Payload/
          cd build
          zip -qr AgroWatch-iOS.ipa Payload
          zip -qr AgroWatch-iOS-Simulator.zip Payload/App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgroWatch-iOS-App
          path: |
            build/AgroWatch-iOS.ipa
            build/AgroWatch-iOS-Simulator.zip
          retention-days: 14
