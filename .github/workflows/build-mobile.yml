name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web App & Sync Capacitor iOS
        run: |
          cd frontend
          npm run build
          npx cap sync ios

      - name: Build iOS Application (Release)
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package App into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find frontend/ios/App/derived_data -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr AgroWatch-iOS.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgroWatch-iOS-App
          path: build/AgroWatch-iOS.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web App & Sync Capacitor Android
        run: |
          cd frontend
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgroWatch-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
