# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Force Gradle to use compatible Java 21 JDK (fixes Unsupported class file major version 70/69)
org.gradle.java.home=C:\\Users\\RICHIE\\.jdks\\jbr-21.0.11

# Enable parallel execution and build caching for faster builds
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Suppress compileSdk 36 warning/error for AGP 8.7.2
android.suppressUnsupportedCompileSdk=36
