<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315c3b" />
      <stop offset="100%" stop-color="#1f3e26" />
    </linearGradient>
    <linearGradient id="fav-leaf-l" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3ecde" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="fav-leaf-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c5dbbe" />
    </linearGradient>
  </defs>

  <rect width="36" height="36" rx="9" fill="url(#fav-tile)" />

  <!-- Drone reticle corner guides -->
  <path d="M 8 13 V 9.5 A 1.5 1.5 0 0 1 9.5 8 H 13" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
  <path d="M 23 8 H 26.5 A 1.5 1.5 0 0 1 28 9.5 V 13" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
  <path d="M 28 23 V 26.5 A 1.5 1.5 0 0 1 26.5 28 H 23" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
  <path d="M 13 28 H 9.5 A 1.5 1.5 0 0 1 8 26.5 V 23" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />

  <!-- Primary Stem -->
  <path d="M 18 26.5 V 13" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" />

  <!-- Twin growth foliar blades -->
  <path d="M 18 21.5 C 14.2 21.5 10.5 18.8 11.2 13.8 C 15.5 14 17.5 17.5 18 20.2" fill="url(#fav-leaf-l)" />
  <path d="M 18 17.5 C 21.8 17.5 25.5 14.8 24.8 9.8 C 20.5 10 18.5 13.5 18 16.2" fill="url(#fav-leaf-r)" />

  <!-- Amber optical beacon dot -->
  <circle cx="18" cy="9.2" r="1.85" fill="#d0a85d" />
  <circle cx="18" cy="9.2" r="0.75" fill="#ffffff" />
